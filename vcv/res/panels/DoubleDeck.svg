<?xml version="1.0" encoding="UTF-8"?>
<!-- Pannello di Double Deck, 64 HP (325,12 x 128,5 mm).

     Qui c'è **solo la grafica**: nanosvg non rende gli elementi <text>, quindi
     titolo, nomi delle sezioni ed etichette dei controlli sono widget disegnati
     da PanelLabel in src/DoubleDeck.cpp. Le coordinate delle fasce qui sotto e
     la griglia di quel file sono la stessa cosa scritta due volte: se cambia
     una, cambia l'altra.

     Griglia: colonne da 20 mm, righe da 12,5 mm con la prima a y = 27,5. Ogni
     riga del pannello è una fascia (`band`) alta quanto il passo, tinta a
     tinte alterne, e corrisponde a una sezione funzionale: è la fascia a dire
     dove finisce PLAYHEAD e comincia SHAPE, senza spendere righe in
     intestazioni. La colonna dei jack di ogni deck (TRIG, GATE IN/OUT, MOD) è
     il blocco più chiaro sulla destra, staccato dalle fasce.

     Ogni riquadro ha a sinistra un corridoio da 5 mm: è lì che PanelLabel
     scrive il nome della sezione, ruotato di 90°. -->
<svg xmlns="http://www.w3.org/2000/svg" width="325.12mm" height="128.5mm" viewBox="0 0 325.12 128.5">
  <rect width="325.12" height="128.5" fill="#131316"/>

  <!-- Riquadri: deck A, deck B, globali. -->
  <rect x="5" y="13" width="109" height="109" rx="2.5" fill="#1b1b20"/>
  <rect x="118" y="13" width="109" height="109" rx="2.5" fill="#1b1b20"/>
  <rect x="231" y="13" width="89" height="109" rx="2.5" fill="#1b1b20"/>

  <!-- Barrette d'accento: distinguono i due deck a colpo d'occhio, dove i
       controlli sono per forza identici. -->
  <rect x="5" y="13" width="109" height="1.6" rx="0.8" fill="#5b9dd9"/>
  <rect x="118" y="13" width="109" height="1.6" rx="0.8" fill="#d99a5b"/>
  <rect x="231" y="13" width="89" height="1.6" rx="0.8" fill="#7fb08a"/>

  <!-- Deck A: TRANSPORT, PLAYHEAD, SHAPE, MOD (cinque colonne)… -->
  <rect x="12" y="18.25" width="100" height="12.5" fill="#282830"/>
  <rect x="12" y="30.75" width="100" height="12.5" fill="#1b1b22"/>
  <rect x="12" y="43.25" width="100" height="12.5" fill="#282830"/>
  <rect x="12" y="55.75" width="100" height="12.5" fill="#1b1b22"/>
  <!-- …poi GRIT, FLUX, SEQ, CV su quattro, per lasciare libera la colonna dei jack. -->
  <rect x="12" y="68.25" width="80" height="12.5" fill="#282830"/>
  <rect x="12" y="80.75" width="80" height="12.5" fill="#1b1b22"/>
  <rect x="12" y="93.25" width="80" height="12.5" fill="#282830"/>
  <rect x="12" y="105.75" width="80" height="15" fill="#1b1b22"/>
  <rect x="92" y="68.25" width="20" height="52.5" rx="1.5" fill="#2e2e38"/>
  <!-- Il passo di 12,5 mm lascia meno di un millimetro fra un controllo e
       l'etichetta di quello sotto: senza un filo che separi le fasce, il nome
       sembra appartenere alla riga sbagliata. -->
  <g fill="#3a3a46">
    <rect x="12" y="30.65" width="100" height="0.25"/>
    <rect x="12" y="43.15" width="100" height="0.25"/>
    <rect x="12" y="55.65" width="100" height="0.25"/>
    <rect x="12" y="68.15" width="100" height="0.25"/>
    <rect x="12" y="80.65" width="80" height="0.25"/>
    <rect x="12" y="93.15" width="80" height="0.25"/>
    <rect x="12" y="105.65" width="80" height="0.25"/>
  </g>

  <!-- Deck B: stessa griglia, traslata di 113 mm. -->
  <rect x="125" y="18.25" width="100" height="12.5" fill="#282830"/>
  <rect x="125" y="30.75" width="100" height="12.5" fill="#1b1b22"/>
  <rect x="125" y="43.25" width="100" height="12.5" fill="#282830"/>
  <rect x="125" y="55.75" width="100" height="12.5" fill="#1b1b22"/>
  <rect x="125" y="68.25" width="80" height="12.5" fill="#282830"/>
  <rect x="125" y="80.75" width="80" height="12.5" fill="#1b1b22"/>
  <rect x="125" y="93.25" width="80" height="12.5" fill="#282830"/>
  <rect x="125" y="105.75" width="80" height="15" fill="#1b1b22"/>
  <rect x="205" y="68.25" width="20" height="52.5" rx="1.5" fill="#2e2e38"/>
  <g fill="#3a3a46">
    <rect x="125" y="30.65" width="100" height="0.25"/>
    <rect x="125" y="43.15" width="100" height="0.25"/>
    <rect x="125" y="55.65" width="100" height="0.25"/>
    <rect x="125" y="68.15" width="100" height="0.25"/>
    <rect x="125" y="80.65" width="80" height="0.25"/>
    <rect x="125" y="93.15" width="80" height="0.25"/>
    <rect x="125" y="105.65" width="80" height="0.25"/>
  </g>

  <!-- Globali: CLOCK (due righe), MIX (due righe), AUDIO (una). Le righe
       vuote in mezzo separano i gruppi. -->
  <rect x="238" y="18.25" width="80" height="27.5" rx="1.5" fill="#282830"/>
  <rect x="238" y="55.75" width="80" height="27.5" rx="1.5" fill="#282830"/>
  <rect x="238" y="93.25" width="80" height="15" rx="1.5" fill="#282830"/>
  <g fill="#3a3a46">
    <rect x="238" y="30.65" width="80" height="0.25"/>
    <rect x="238" y="68.15" width="80" height="0.25"/>
  </g>
</svg>
